{% extends 'base.html' %}
{% block title %}{{ stadium }}{% endblock %}
{% block content %}
<section class="page-heading"><span class="eyebrow">ФУТБОЛЬНАЯ АРЕНА</span><h1>{{ stadium }}</h1></section>
<section class="glass-panel"><h2>Команды стадиона</h2><div class="card-grid">{% for team in teams %}<a class="entity-card" href="{% url 'team_detail' team.id %}"><div class="entity-icon">⚽</div><h3>{{ team }}</h3></a>{% empty %}<p class="muted">Связанные команды не указаны.</p>{% endfor %}</div></section>
{% endblock %}
